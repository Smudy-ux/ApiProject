name: Sparta Api build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the Docker image
        run: docker build -t spartaacademyapi SpartaAcademyApp/SpartaAcademyAPI

      - name: Run the container
        run: docker run -d --name sparta-api -p 8080:8080 spartaacademyapi

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/api/courses && echo "API is up" && exit 0
            echo "Waiting... ($i)"; sleep 2
          done
          echo "API did not start"
          exit 1

      - name: Tests
        working-directory: api-tests
        run: mvn -B test

      - name: Show container logs
        if: failure()
        run: docker logs sparta-api

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: api-tests/target/cucumber-reports
          if-no-files-found: warn
